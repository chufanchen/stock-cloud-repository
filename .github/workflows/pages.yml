name: 发布复盘网页

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/ashare_cloud/pages.py'
      - 'cloud/ashare_cloud/publication.py'
      - 'cloud/web/**'
      - 'cloud/pages-requirements.txt'
      - '.github/workflows/pages.yml'
  schedule:
    # 北京时间21:17、22:17、23:17；与服务器的每日任务分开。
    - cron: '17 1,13,14,15 * * 1-5'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: cloud
      PYTHONUNBUFFERED: '1'
      R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      R2_PREFIX: ${{ vars.R2_PREFIX || secrets.R2_PREFIX || 'wuming-v2' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_PAGES_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PAGES_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cloud/pages-requirements.txt
      - name: 安装网页构建依赖
        run: python -m pip install -r cloud/pages-requirements.txt
      - name: 只读下载展示结果包并生成静态网页
        run: python -m ashare_cloud.pages --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
