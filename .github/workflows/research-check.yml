name: 研究数据接口检查

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: '抽查股票代码，逗号分隔；仅查询公开数据'
        default: '600519,600000'
        type: string
      trade_date:
        description: '留空为北京时间今天；历史日期仅允许已有同日归档，本检查不会恢复R2'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ashare-research-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
      PYTHONPATH: cloud
      PYTHONUNBUFFERED: '1'
      RESEARCH_SYMBOLS: ${{ inputs.symbols }}
      RESEARCH_DATE: ${{ inputs.trade_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cloud/requirements.lock
      - run: python -m pip install -r cloud/requirements.lock
      - name: 检查公开研究接口（不读写R2或账户、不调用AI）
        shell: bash
        run: |
          args=()
          if [ -n "$RESEARCH_DATE" ]; then
            args+=(--date "$RESEARCH_DATE")
          fi
          python -m ashare_cloud.research_data --state-dir .research-check --symbols "$RESEARCH_SYMBOLS" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-source-check-${{ github.run_id }}
          path: .research-check/research/data/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
